<title>Landing in Kansas City</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Graduate&family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,500&family=DM+Mono:wght@400;500&display=swap">
<style>
  /* Layout: golden-hour harvest sky — sun sets over rolling fields and a KC skyline as the countdown runs; leaves and photos drift; polaroid wall under the clock */
  :root{
    --sky-top:#F7E3C0; --sky-mid:#F2C98A; --sky-low:#E9A964;
    --hill-far:#C98B4E; --hill-near:#9C5E2E; --field:#7A4521;
    --gold:#F1B82D; --black:#17120D;
    --leaf-1:#C8641E; --leaf-2:#E39A2B; --leaf-3:#A3471B; --leaf-4:#D9B13A; --leaf-5:#8C6A2A;
    --ink:#2B1B10; --ink-dim:rgba(43,27,16,.72);
    --paper:#FFFBF2;
    --display:'Graduate', 'Rockwell', Georgia, serif;
    --serif:'Fraunces', Georgia, serif;
    --mono:'DM Mono', ui-monospace, Menlo, monospace;
    color-scheme:light;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{min-height:100%;}
  body{background:var(--sky-top);color:var(--ink);font-family:var(--serif);overflow-x:hidden;}

  .sky{
    position:relative; min-height:100vh; min-height:100dvh; width:100%;
    background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-mid) 55%,var(--sky-low) 100%);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    padding-left:max(16px,env(safe-area-inset-left,0px));
    padding-right:max(16px,env(safe-area-inset-right,0px));
    padding-block:48px 170px;
  }
  .sun{
    position:absolute; left:50%; z-index:0; pointer-events:none;
    width:clamp(160px,26vw,300px); aspect-ratio:1; border-radius:50%;
    transform:translateX(-50%);
    background:radial-gradient(circle,rgba(255,236,190,.95) 0%,rgba(250,196,110,.7) 40%,rgba(244,170,80,0) 70%);
    bottom:var(--sun-bottom,40%);
    transition:bottom 2s ease;
  }
  .plane{
    position:absolute; top:12%; left:-10%; z-index:1; font-size:22px; color:rgba(43,27,16,.35);
    animation:fly 26s linear infinite; pointer-events:none;
  }
  @keyframes fly{from{left:-10%}to{left:110%}}

  .land{position:absolute; left:0; right:0; bottom:0; z-index:1; pointer-events:none;}
  .land{height:clamp(130px,16vw,210px);} .land svg{display:block; width:100%; height:100%;}
  .land .far{fill:var(--hill-far); opacity:.75;}
  .land .city{fill:var(--hill-near); opacity:.8;}
  .land .near{fill:var(--field);}
  .land .row{stroke:rgba(241,184,45,.35); stroke-width:2; fill:none;}

  .drift{position:absolute; inset:0; z-index:1; pointer-events:none; overflow:hidden;}
  .fall{
    position:absolute; top:-140px; opacity:0;
    animation:fall var(--dur,30s) linear infinite, sway var(--sw,5s) ease-in-out infinite alternate;
    animation-delay:var(--delay,0s), 0s;
  }
  .leaf{width:var(--w,22px); height:var(--w,22px); color:var(--c,var(--leaf-1));}
  .leaf svg{width:100%;height:100%;display:block;fill:currentColor;}
  .snap{
    width:var(--w,64px); aspect-ratio:3/4;
    background-color:var(--paper); background-size:cover; background-position:center;
    border:5px solid var(--paper); border-bottom-width:15px; border-radius:2px;
    box-shadow:0 6px 16px rgba(80,40,10,.28);
  }
  @keyframes fall{
    0%{transform:translateY(0) rotate(var(--rot,0deg));opacity:0}
    8%{opacity:.85} 92%{opacity:.85}
    100%{transform:translateY(125vh) rotate(calc(var(--rot,0deg) + var(--spin,40deg)));opacity:0}
  }
  @keyframes sway{from{margin-left:-18px}to{margin-left:18px}}

  .content{
    position:relative; z-index:2; width:100%; max-width:760px;
    display:flex; flex-direction:column; align-items:center; text-align:center; gap:22px;
  }
  .eyebrow{
    font-family:var(--mono); font-size:.72rem; letter-spacing:.2em; text-transform:uppercase;
    color:var(--ink-dim); display:flex; align-items:center; gap:10px;
  }
  .eyebrow::before,.eyebrow::after{content:""; width:28px; height:1px; background:var(--ink-dim);}
  h1{
    font-family:var(--serif); font-style:italic; font-weight:500;
    font-size:clamp(1.7rem,5.2vw,3rem); line-height:1.15; text-wrap:balance; color:var(--ink);
  }
  .clock{display:flex; justify-content:center; flex-wrap:wrap; gap:clamp(10px,2.4vw,16px);}
  .unit{
    min-width:clamp(68px,17vw,104px); padding:14px 10px 10px;
    background:var(--black); border-radius:8px;
    box-shadow:0 8px 20px rgba(80,40,10,.25), inset 0 -3px 0 var(--gold);
    display:flex; flex-direction:column; align-items:center; gap:6px;
  }
  .num{font-family:var(--display); color:var(--gold); font-size:clamp(2rem,7vw,3.4rem); line-height:1; font-variant-numeric:tabular-nums;}
  .label{font-family:var(--mono); font-size:.62rem; letter-spacing:.16em; text-transform:uppercase; color:rgba(255,244,222,.7);}
  .subhead{font-family:var(--mono); font-size:.86rem; color:var(--ink-dim);}
  .subhead b{color:var(--ink); font-weight:500;}

  .polaroids{display:flex; justify-content:center; flex-wrap:wrap; gap:8px; margin-top:6px; max-width:620px;}
  .polaroids .snap{--w:clamp(76px,13vw,104px); transition:transform .3s ease;}
  .polaroids .snap:nth-child(3n+1){transform:rotate(-5deg) translateY(4px);}
  .polaroids .snap:nth-child(3n+2){transform:rotate(3deg);}
  .polaroids .snap:nth-child(3n){transform:rotate(-1.5deg) translateY(2px);}
  .polaroids .snap:hover{transform:rotate(0) translateY(-6px) scale(1.1); z-index:3;}

  .footer{font-family:var(--serif); font-style:italic; font-size:1.1rem; color:var(--ink);}

  @media (max-width:560px){
    .polaroids{display:grid; grid-template-columns:repeat(3,auto); gap:10px 8px;}
    .polaroids .snap{--w:clamp(78px,25vw,100px);}
    .unit{padding:12px 6px 8px;}
    .drift{opacity:.6;}
  }
  @media (prefers-reduced-motion:reduce){ .drift{display:none;} .plane{animation:none; left:12%;} }
</style>

<script>
  const TARGET = new Date("2026-11-12T23:48:00-06:00").getTime();
  const START  = new Date("2026-10-09T00:00:00-05:00").getTime();
  const sun = document.getElementById('sun');
  const pad = n=>String(n).padStart(2,'0');
  function update(){
    const now = Date.now(), remaining = TARGET - now;
    const f = Math.min(1, Math.max(0, (now-START)/(TARGET-START)));
    sun.style.setProperty('--sun-bottom', (55 - f*45)+'%');
    if(remaining <= 0){
      document.getElementById('headline').textContent = "I'm here.";
      document.getElementById('subhead').textContent = "Landed in Kansas City.";
      document.getElementById('footer').textContent = "Come find me at arrivals.";
      document.getElementById('countdown').hidden = true;
      return;
    }
    const t = Math.floor(remaining/1000);
    document.getElementById('d').textContent = pad(Math.floor(t/86400));
    document.getElementById('h').textContent = pad(Math.floor((t%86400)/3600));
    document.getElementById('m').textContent = pad(Math.floor((t%3600)/60));
    document.getElementById('s').textContent = pad(t%60);
  }
  update(); setInterval(update, 1000);
</script>
